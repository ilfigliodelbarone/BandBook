<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BandBook - Repertorio & Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .tab-text { font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; line-height: 1.4; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400 tracking-wide">🎸 BAND BOOK</h1>
            <button onclick="caricaDati()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded border border-slate-700">
                🔄 Aggiorna
            </button>
        </div>
    </header>

    <!-- Contenuto principale -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4">

        <!-- VISTA 1: Lista brani -->
        <div id="vista-lista">
            <input type="text" id="cerca" onkeyup="filtraBrani()" placeholder="🔍 Cerca titolo o artista..."
                class="w-full p-3 mb-4 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-amber-400">

            <div id="stato-caricamento" class="text-center text-slate-400 py-10">Caricamento repertorio...</div>
            <div id="elenco-brani" class="space-y-3"></div>
        </div>

        <!-- VISTA 2: Dettaglio brano -->
        <div id="vista-dettaglio" class="hidden">
            <button onclick="tornaAllaLista()" class="mb-4 inline-flex items-center text-sm text-amber-400 hover:underline">
                ← Torna alla scaletta
            </button>

            <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 mb-5">
                <h2 id="det-titolo" class="text-2xl font-bold text-white"></h2>
                <p id="det-artista" class="text-slate-400 text-sm"></p>
            </div>

            <p class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Seleziona strumento o testo:</p>
            <div id="bottoni-strumenti" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5"></div>

            <div id="area-tab" class="bg-black border border-slate-700 rounded-xl p-4 min-h-[250px] shadow-inner">
                <p class="text-slate-500 text-center py-10">Seleziona uno strumento o Lyrics qui sopra.</p>
            </div>
        </div>

    </main>

    <script>
        // URL CSV del Google Sheet pubblicato sul web
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3CCm54jUvGmoX4EhdjzkWP5wu-KTVTFElQ_duTjafKpQtnaYoRI7wrW3Olo-K-peDWM441vchyNvj/pub?gid=0&single=true&output=csv";

        // Colonne esatte del foglio (A: Titolo, B: Artista, C: Tab Chitarra, D: Tab Basso, E: Tab Batteria, F: Lyrics)
        const COLONNE_CONTENUTO = [
            { etichetta: "Chitarra", colonna: "Tab Chitarra" },
            { etichetta: "Basso",    colonna: "Tab Basso" },
            { etichetta: "Batteria", colonna: "Tab Batteria" },
            { etichetta: "Lyrics",   colonna: "Lyrics" }
        ];

        let tuttiIBrani = [];
        let branoCorrente = null;

        // Legge il valore di una colonna del foglio in modo tollerante a spazi e maiuscole/minuscole
        function leggiColonna(riga, nomeColonna) {
            const target = String(nomeColonna || "").trim().toLowerCase();
            const chiave = Object.keys(riga || {}).find(k => String(k).trim().toLowerCase() === target);
            return chiave ? String(riga[chiave] ?? "").trim() : "";
        }

        // Scarica e analizza il CSV da Google Sheets
        function caricaDati() {
            const stato = document.getElementById('stato-caricamento');
            stato.style.display = 'block';
            stato.textContent = "Caricamento repertorio...";
            document.getElementById('elenco-brani').innerHTML = '';

            // Evita la cache del browser aggiungendo un parametro temporale
            const urlConCacheBuster = GOOGLE_SHEET_CSV_URL +
                (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') +
                '_=' + Date.now();

            Papa.parse(urlConCacheBuster, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const righe = Array.isArray(results.data) ? results.data : [];

                    tuttiIBrani = righe
                        .map(riga => ({
                            titolo: leggiColonna(riga, "Titolo"),
                            artista: leggiColonna(riga, "Artista"),
                            valori: COLONNE_CONTENUTO.reduce((acc, item) => {
                                acc[item.colonna] = leggiColonna(riga, item.colonna);
                                return acc;
                            }, {})
                        }))
                        .filter(brano => brano.titolo !== "");

                    if (tuttiIBrani.length === 0) {
                        stato.textContent = "Nessun brano trovato. Verifica che il foglio sia pubblicato come CSV e contenga la colonna 'Titolo'.";
                        return;
                    }

                    stato.style.display = 'none';
                    renderLista(tuttiIBrani);
                },
                error: function(err) {
                    stato.textContent = "Errore durante il caricamento del Google Sheet" + (err && err.message ? ": " + err.message : ".");
                }
            });
        }

        // Renderizza la lista dei brani
        function renderLista(lista) {
            const container = document.getElementById('elenco-brani');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center">Nessun brano trovato.</p>';
                return;
            }

            lista.forEach(brano => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 hover:bg-slate-750 border border-slate-700 p-4 rounded-xl cursor-pointer transition";
                card.onclick = () => apriBrano(brano);

                const titoloEl = document.createElement('h3');
                titoloEl.className = "font-bold text-lg text-white";
                titoloEl.textContent = brano.titolo;

                const artistaEl = document.createElement('p');
                artistaEl.className = "text-sm text-slate-400";
                artistaEl.textContent = brano.artista;

                card.appendChild(titoloEl);
                card.appendChild(artistaEl);
                container.appendChild(card);
            });
        }

        // Filtra i brani per titolo o artista
        function filtraBrani() {
            const query = document.getElementById('cerca').value.trim().toLowerCase();
            const filtrati = tuttiIBrani.filter(brano =>
                brano.titolo.toLowerCase().includes(query) ||
                brano.artista.toLowerCase().includes(query)
            );
            renderLista(filtrati);
        }

        // Apre la vista dettaglio del brano e genera i pulsanti per le colonne popolate
        function apriBrano(brano) {
            branoCorrente = brano;
            document.getElementById('vista-lista').classList.add('hidden');
            document.getElementById('vista-dettaglio').classList.remove('hidden');

            document.getElementById('det-titolo').textContent = brano.titolo;
            document.getElementById('det-artista').textContent = brano.artista;

            const btnContainer = document.getElementById('bottoni-strumenti');
            btnContainer.innerHTML = '';

            COLONNE_CONTENUTO.forEach(item => {
                const contenuto = brano.valori[item.colonna] || "";
                const haContenuto = contenuto !== "";

                const btn = document.createElement('button');
                btn.textContent = item.etichetta;
                btn.className = haContenuto
                    ? "py-2.5 px-3 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-600 transition"
                    : "py-2.5 px-3 rounded-lg font-semibold text-sm bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed";

                if (!haContenuto) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => mostraContenuto(item.etichetta, contenuto, btn);
                }

                btnContainer.appendChild(btn);
            });

            document.getElementById('area-tab').innerHTML = '<p class="text-slate-500 text-center py-10">👆 Tocca uno strumento o Lyrics qui sopra.</p>';
        }

        // Se il valore è un link apre una nuova scheda; altrimenti mostra il testo nel riquadro
        function mostraContenuto(etichetta, contenuto, bottoneCliccato) {
            if (/^https?:\/\//i.test(contenuto)) {
                window.open(contenuto, '_blank', 'noopener,noreferrer');
                return;
            }

            document.querySelectorAll('#bottoni-strumenti button').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-slate-950', 'border-amber-400');
            });
            bottoneCliccato.classList.add('bg-amber-400', 'text-slate-950', 'border-amber-400');

            const areaTab = document.getElementById('area-tab');
            areaTab.innerHTML = '';

            const intestazione = document.createElement('div');
            intestazione.className = "mb-2 text-xs text-amber-400 font-bold uppercase";
            intestazione.textContent = etichetta;

            const testoEl = document.createElement('div');
            testoEl.className = "tab-text text-sm sm:text-base text-slate-100 overflow-x-auto";
            testoEl.textContent = contenuto;

            areaTab.appendChild(intestazione);
            areaTab.appendChild(testoEl);
        }

        // Torna alla lista dei brani
        function tornaAllaLista() {
            document.getElementById('vista-dettaglio').classList.add('hidden');
            document.getElementById('vista-lista').classList.remove('hidden');
        }

        caricaDati();
    </script>
</body>
</html>
