<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BandBook - Repertorio & Tab</title>
    <!-- Carichiamo Tailwind CSS per lo stile e PapaParse per leggere il Google Sheet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .tab-text { font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; line-height: 1.4; }
        .lyrics-text { white-space: pre-wrap; line-height: 1.6; overflow-wrap: anywhere; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400 tracking-wide">🎸 BAND BOOK</h1>
            <button onclick="caricaDati()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded border border-slate-700">
                🔄 Aggiorna
            </button>
        </div>
    </header>

    <!-- Contenuto Principale -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4">

        <!-- VISTA 1: Lista Brani -->
        <div id="vista-lista">
            <input type="text" id="cerca" onkeyup="filtraBrani()" placeholder="🔍 Cerca titolo o artista..." 
                class="w-full p-3 mb-4 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-amber-400">
            
            <div id="stato-caricamento" class="text-center text-slate-400 py-10">Caricamento repertorio...</div>
            <div id="elenco-brani" class="space-y-3"></div>
        </div>

        <!-- VISTA 2: Dettaglio Brano & Selettore Strumento -->
        <div id="vista-dettaglio" class="hidden">
            <button onclick="tornaAllaLista()" class="mb-4 inline-flex items-center text-sm text-amber-400 hover:underline">
                ← Torna alla scaletta
            </button>

            <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 mb-5">
                <h2 id="det-titolo" class="text-2xl font-bold text-white"></h2>
                <p id="det-artista" class="text-slate-400 text-sm mb-3"></p>
                <div class="flex gap-3 text-xs font-semibold">
                    <span id="det-tonalita" class="bg-indigo-950 text-indigo-300 px-2.5 py-1 rounded border border-indigo-800"></span>
                    <span id="det-bpm" class="bg-emerald-950 text-emerald-300 px-2.5 py-1 rounded border border-emerald-800"></span>
                </div>
            </div>

            <!-- Selettore Strumenti -->
            <p class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Seleziona strumento o testo:</p>
            <div id="bottoni-strumenti" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5"></div>

            <!-- Area Visualizzazione Tab -->
            <div id="area-tab" class="bg-black border border-slate-700 rounded-xl p-4 min-h-[250px] shadow-inner">
                <p class="text-slate-500 text-center py-10">Seleziona uno strumento qui sopra per visualizzare la tab, oppure Lyrics per il testo.</p>
            </div>
        </div>

    </main>

    <script>
        // =====================================================================
        // INCOLLA QUI SOTTO IL LINK CSV DEL TUO GOOGLE SHEET PUBBLICATO SUL WEB
        // =====================================================================
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3CCm54jUvGmoX4EhdjzkWP5wu-KTVTFElQ_duTjafKpQtnaYoRI7wrW3Olo-K-peDWM441vchyNvj/pub?gid=0&single=true&output=csv";

        // Bottoni mostrati e possibili nomi delle colonne nel Google Sheet
        // (il confronto ignora maiuscole, spazi e il prefisso "Tab")
        const STRUMENTI = {
            "Chitarra": ["chitarra", "guitar"],
            "Basso":    ["basso", "bass"],
            "Batteria": ["batteria", "drums", "drum"],
            "Lyrics":   ["lyrics", "lyric", "testo", "testi", "text"]
        };
        const TESTO = "Lyrics";

        // Valori che nel foglio indicano "nessuna tab"
        const VALORI_VUOTI = ["", "null", "-", "n/d", "nd", "n/a", "na"];

        function normalizzaColonna(nome) {
            return String(nome || "").toLowerCase().replace(/^\s*tab\s*/, "").trim();
        }

        // Restituisce il contenuto della cella per lo strumento (o "" se vuota)
        function contenutoStrumento(brano, strumento) {
            const alias = STRUMENTI[strumento];
            const colonna = Object.keys(brano).find(k => alias.includes(normalizzaColonna(k)));
            const valore = colonna ? String(brano[colonna] || "").trim() : "";
            return VALORI_VUOTI.includes(valore.toLowerCase()) ? "" : valore;
        }

        // Link che si possono incorporare in un riquadro (gli altri si aprono in una nuova scheda)
        function urlIncorporabile(url) {
            if (url.includes('drive.google.com/file/d/')) {
                const fileId = url.split('/d/')[1].split('/')[0];
                return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            if (url.includes('docs.google.com/')) return url;
            if (/\.(pdf|png|jpe?g|gif|webp)(\?|#|$)/i.test(url)) return url;
            return null;
        }

        let tuttiIBrani = [];
        let branoCorrente = null;

        // Testi già scaricati (per non richiederli di nuovo) e dimensione del carattere scelta
        const cacheTesti = {};
        const DIMENSIONI_TESTO = ["text-sm", "text-base", "text-lg", "text-xl", "text-2xl", "text-3xl"];
        let dimensioneTesto = Math.min(
            Math.max(parseInt(localStorage.getItem('bandbook-dimensione-testo') ?? '2', 10) || 0, 0),
            DIMENSIONI_TESTO.length - 1
        );

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function nomeSito(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
        }

        // Scarica e legge il CSV da Google Sheets
        function caricaDati() {
            document.getElementById('stato-caricamento').style.display = 'block';
            document.getElementById('elenco-brani').innerHTML = '';

            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    tuttiIBrani = results.data;
                    document.getElementById('stato-caricamento').style.display = 'none';
                    renderLista(tuttiIBrani);
                },
                error: function(err) {
                    document.getElementById('stato-caricamento').innerText = "Errore nel caricamento. Controlla il link CSV.";
                }
            });
        }

        // Mostra la lista dei brani
        function renderLista(lista) {
            const container = document.getElementById('elenco-brani');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center">Nessun brano trovato.</p>';
                return;
            }

            lista.forEach((brano, index) => {
                if (!brano.Titolo) return;
                const card = document.createElement('div');
                card.className = "bg-slate-800 hover:bg-slate-750 border border-slate-700 p-4 rounded-xl cursor-pointer transition flex justify-between items-center";
                card.onclick = () => apriBrano(brano);

                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-lg text-white">${brano.Titolo}</h3>
                        <p class="text-sm text-slate-400">${brano.Artista || ''}</p>
                    </div>
                    <div class="text-right text-xs text-slate-300 space-y-1">
                        ${brano.Tonalita ? `<div class="bg-slate-900 px-2 py-0.5 rounded">${brano.Tonalita}</div>` : ''}
                        ${brano.BPM ? `<div class="text-amber-400 font-mono">${brano.BPM} BPM</div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Ricerca istantanea
        function filtraBrani() {
            const query = document.getElementById('cerca').value.toLowerCase();
            const filtrati = tuttiIBrani.filter(b => 
                (b.Titolo && b.Titolo.toLowerCase().includes(query)) || 
                (b.Artista && b.Artista.toLowerCase().includes(query))
            );
            renderLista(filtrati);
        }

        // Apre la schermata del singolo brano
        function apriBrano(brano) {
            branoCorrente = brano;
            document.getElementById('vista-lista').classList.add('hidden');
            document.getElementById('vista-dettaglio').classList.remove('hidden');

            document.getElementById('det-titolo').innerText = brano.Titolo;
            document.getElementById('det-artista').innerText = brano.Artista || '';
            document.getElementById('det-tonalita').innerText = brano.Tonalita ? `Tonalità: ${brano.Tonalita}` : 'Tonalità: N/D';
            document.getElementById('det-bpm').innerText = brano.BPM ? `${brano.BPM} BPM` : 'BPM: N/D';

            // Crea i bottoni per gli strumenti
            const btnContainer = document.getElementById('bottoni-strumenti');
            btnContainer.innerHTML = '';

            Object.keys(STRUMENTI).forEach(strum => {
                const haContenuto = contenutoStrumento(brano, strum) !== "";
                const btn = document.createElement('button');
                btn.innerText = strum;
                btn.className = haContenuto 
                    ? "py-2.5 px-3 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-600 transition"
                    : "py-2.5 px-3 rounded-lg font-semibold text-sm bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed";
                if (!haContenuto) {
                    btn.disabled = true;
                    btn.title = strum === TESTO ? "Nessun testo disponibile per questo brano" : "Nessuna tab disponibile per questo strumento";
                }

                if (haContenuto) {
                    btn.onclick = () => mostraTab(strum, btn);
                }
                btnContainer.appendChild(btn);
            });

            document.getElementById('area-tab').innerHTML = '<p class="text-slate-500 text-center py-10">👆 Tocca uno strumento qui sopra per aprire la tab, oppure Lyrics per il testo.</p>';
        }

        // Mostra il contenuto della tab (Link PDF/Drive oppure Testo)
        function mostraTab(strumento, bottoneCliccato) {
            // Evidenzia il bottone attivo
            document.querySelectorAll('#bottoni-strumenti button').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-slate-950', 'border-amber-400');
            });
            bottoneCliccato.classList.add('bg-amber-400', 'text-slate-950', 'border-amber-400');

            const contenuto = contenutoStrumento(branoCorrente, strumento);
            const areaTab = document.getElementById('area-tab');

            if (strumento === TESTO) {
                mostraTesto(contenuto, areaTab);
                return;
            }

            // Controlla se nella cella c'è un link
            if (contenuto.startsWith('http://') || contenuto.startsWith('https://')) {
                const embedUrl = urlIncorporabile(contenuto);
                if (embedUrl) {
                    // Google Drive, PDF o immagini: anteprima incorporata
                    areaTab.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-amber-400 font-bold uppercase">${strumento} (Documento)</span>
                            <a href="${contenuto}" target="_blank" rel="noopener" class="text-xs bg-slate-800 px-2 py-1 rounded text-white hover:bg-slate-700">Apri a schermo intero ↗</a>
                        </div>
                        <iframe src="${embedUrl}" class="w-full h-[65vh] rounded border border-slate-700 bg-white"></iframe>
                    `;
                } else {
                    // Siti come Songsterr non permettono l'incorporamento: apre in una nuova scheda
                    let sito = contenuto;
                    try { sito = new URL(contenuto).hostname.replace(/^www\./, ''); } catch (e) {}
                    areaTab.innerHTML = `
                        <div class="mb-2 text-xs text-amber-400 font-bold uppercase">${strumento} (Link esterno)</div>
                        <div class="text-center py-10 space-y-4">
                            <p class="text-slate-400 text-sm">La tab è su <span class="text-white font-semibold">${sito}</span>, che non può essere mostrato qui dentro.</p>
                            <a href="${contenuto}" target="_blank" rel="noopener" class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-3 rounded-lg transition">Apri la tab ↗</a>
                        </div>
                    `;
                }
            } else {
                // Altrimenti lo mostra come testo/tab formattato
                areaTab.innerHTML = `
                    <div class="mb-2 text-xs text-amber-400 font-bold uppercase">${strumento} (Tab / Accordi)</div>
                    <div class="tab-text text-sm sm:text-base text-slate-100 overflow-x-auto">${contenuto}</div>
                `;
            }
        }

        // Mostra il testo della canzone: se nel foglio c'è un link (es. Genius) lo estrae tramite /api/lyrics
        async function mostraTesto(contenuto, areaTab) {
            const brano = branoCorrente;
            const eLink = /^https?:\/\//i.test(contenuto);

            if (!eLink) {
                renderTesto(areaTab, contenuto, null, null);
                return;
            }

            if (!cacheTesti[contenuto]) {
                areaTab.innerHTML = `
                    <div class="mb-2 text-xs text-amber-400 font-bold uppercase">Lyrics</div>
                    <p class="text-slate-400 text-center py-10 animate-pulse">Caricamento del testo da ${escapeHtml(nomeSito(contenuto))}...</p>
                `;
                const params = new URLSearchParams({ url: contenuto, artist: brano.Artista || '', title: brano.Titolo || '' });
                try {
                    const res = await fetch(`/api/lyrics?${params}`);
                    const dati = await res.json();
                    if (!res.ok || !dati.lyrics) throw new Error(dati.error || 'Testo non disponibile');
                    cacheTesti[contenuto] = dati;
                } catch (err) {
                    if (branoCorrente !== brano || !areaTab.isConnected) return;
                    if (!bottoneAttivo(TESTO)) return;
                    areaTab.innerHTML = `
                        <div class="mb-2 text-xs text-amber-400 font-bold uppercase">Lyrics</div>
                        <div class="text-center py-10 space-y-4">
                            <p class="text-slate-400 text-sm">Non è stato possibile caricare il testo da <span class="text-white font-semibold">${escapeHtml(nomeSito(contenuto))}</span>.</p>
                            <a href="${escapeHtml(contenuto)}" target="_blank" rel="noopener" class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-3 rounded-lg transition">Apri il testo ↗</a>
                        </div>
                    `;
                    return;
                }
            }

            // L'utente potrebbe aver cambiato brano o strumento durante il caricamento
            if (branoCorrente !== brano || !bottoneAttivo(TESTO)) return;
            const dati = cacheTesti[contenuto];
            renderTesto(areaTab, dati.lyrics, contenuto, dati.source);
        }

        function bottoneAttivo(nome) {
            const attivo = document.querySelector('#bottoni-strumenti button.bg-amber-400');
            return attivo && attivo.innerText === nome;
        }

        function renderTesto(areaTab, testo, link, fonte) {
            const nota = fonte === 'lrclib'
                ? `Testo da LRCLIB (${escapeHtml(nomeSito(link))} non era raggiungibile)`
                : (link ? `Testo da ${escapeHtml(nomeSito(link))}` : '');
            areaTab.innerHTML = `
                <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                    <span class="text-xs text-amber-400 font-bold uppercase">Lyrics</span>
                    <div class="flex items-center gap-1">
                        <button onclick="cambiaDimensioneTesto(-1)" title="Testo più piccolo" class="text-xs bg-slate-800 px-2.5 py-1 rounded text-white hover:bg-slate-700 font-bold">A−</button>
                        <button onclick="cambiaDimensioneTesto(1)" title="Testo più grande" class="text-xs bg-slate-800 px-2.5 py-1 rounded text-white hover:bg-slate-700 font-bold">A+</button>
                        ${link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener" class="text-xs bg-slate-800 px-2 py-1 rounded text-white hover:bg-slate-700 ml-1">Apri su ${escapeHtml(nomeSito(link))} ↗</a>` : ''}
                    </div>
                </div>
                <div id="testo-canzone" class="lyrics-text ${DIMENSIONI_TESTO[dimensioneTesto]} text-slate-100"></div>
                ${nota ? `<p class="mt-4 text-[11px] text-slate-500">${nota}</p>` : ''}
            `;
            // textContent: il testo viene mostrato così com'è, senza interpretare HTML
            const box = document.getElementById('testo-canzone');
            box.textContent = testo;
            // Evidenzia le sezioni come [Ritornello] o [Verse 1]
            box.innerHTML = box.innerHTML.replace(/^(\[[^\]\n]+\])$/gm, '<span class="text-amber-400 font-semibold">$1</span>');
        }

        function cambiaDimensioneTesto(delta) {
            dimensioneTesto = Math.min(Math.max(dimensioneTesto + delta, 0), DIMENSIONI_TESTO.length - 1);
            localStorage.setItem('bandbook-dimensione-testo', String(dimensioneTesto));
            const box = document.getElementById('testo-canzone');
            if (!box) return;
            box.classList.remove(...DIMENSIONI_TESTO);
            box.classList.add(DIMENSIONI_TESTO[dimensioneTesto]);
        }

        function tornaAllaLista() {
            document.getElementById('vista-dettaglio').classList.add('hidden');
            document.getElementById('vista-lista').classList.remove('hidden');
        }

        // Avvio automatico
        caricaDati();
    </script>
</body>
</html>
